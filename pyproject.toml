[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ourmemory"
version = "0.1.0"
description = "Stateless, Three-State Memory Kernel for Relational AI & Digital Life"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "ourmemory contributors" }
]
keywords = [
  "ai-memory",
  "digital-life",
  "companion-ai",
  "sqlite-fts5",
  "hybrid-retrieval",
  "knowledge-graph",
  "state-machine",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
speed = ["numpy>=1.24"]
dev = ["pytest>=7.4", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/Qiongkura/OurMemory"
Repository = "https://github.com/Qiongkura/OurMemory"
Issues = "https://github.com/Qiongkura/OurMemory/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ourmemory*"]

[tool.setuptools.package-data]
"ourmemory.dashboard" = ["web/*.html"]
